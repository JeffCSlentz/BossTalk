name: Deploying

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy
    # Runs on the self-hosted runner installed on the Windows machine that
    # also hosts the bot — no SSH/remote host involved (see deploy.ps1 and
    # RUNNING_BOSS_TALK.md for the one-time runner + NSSM service setup).
    runs-on: self-hosted

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Default clean:true runs `git clean -ffdx` before checkout, which
          # wipes gitignored files this checkout depends on between runs —
          # packages/bot/.env (provisioned once, see deploy.ps1) and any
          # local data/log files the running bot writes back into this tree.
          clean: false

      - name: Deploy
        shell: powershell
        run: ./deploy.ps1
